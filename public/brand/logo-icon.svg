<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- primary/20 to secondary/20 gradient over dark base -->
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a8f0ed" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#b897b3" stop-opacity="0.20"/>
    </linearGradient>
    <!-- subtle-glow: mint halo around the icon -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a8f0ed" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#a8f0ed" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#a8f0ed" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Brand background (dark, matches site) -->
  <rect width="512" height="512" rx="96" ry="96" fill="#0a0a0c"/>

  <!-- Subtle outer glow centered on icon -->
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- Tinted gradient panel (the from-primary/20 to-secondary/20 effect) -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#boxGrad)"/>

  <!-- Lightbulb icon (Lucide), scaled and centered.
       Original viewBox is 24x24. Scale by 14 → 336, center offset (512-336)/2 = 88 -->
  <g transform="translate(88,88) scale(14)"
     fill="none" stroke="#a8f0ed" stroke-width="2.5"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/>
    <path d="M9 18h6"/>
    <path d="M10 22h4"/>
  </g>
</svg>
